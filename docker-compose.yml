services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: celebritygift
      POSTGRES_USER: celebritygift
      POSTGRES_PASSWORD: celebritygift
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U celebritygift -d celebritygift"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
